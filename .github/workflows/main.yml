name: LSP Plugins (Windows + macOS) with HiDPI fix

on:
  push:
    branches: [master, main, devel]
  pull_request:
    branches: [master, main, devel]
  workflow_dispatch:

env:
  FEATURES: "ui vst2 vst3 clap"
  MAKEFLAGS: "-j4"

jobs:
  # --------------------------------------------------------------------------
  # Windows x86_64
  # --------------------------------------------------------------------------
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 + toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python

      - name: Fetch official LSP sources
        run: |
          git clone --depth 1 https://github.com/lsp-plugins/lsp-plugins.git lsp
          cd lsp
          make config FEATURES="${{ env.FEATURES }}"
          make fetch

      - name: Apply HiDPI fix (robust)
        run: |
          cd lsp
          SURFACE=$(find modules -path "*/lsp-ws-lib/src/main/win/WinDDSurface.cpp" | head -1)
          DISPLAY=$(find modules -path "*/lsp-ws-lib/src/main/win/WinDisplay.cpp" | head -1)

          if [ -z "$SURFACE" ] || [ -z "$DISPLAY" ]; then
            echo "ERROR: WinDDSurface.cpp / WinDisplay.cpp not found"
            find modules -name "WinDD*.cpp" || true
            exit 1
          fi

          echo "Patching $SURFACE"
          python3 - << 'PY' "$SURFACE"
          import sys, re
          path = sys.argv[1]
          with open(path, "r", encoding="utf-8", errors="replace") as f:
              src = f.read()

          helper = '''
              static FLOAT get_window_dpi(HWND hwnd)
              {
                  if (hwnd)
                  {
                      HMODULE user32 = ::GetModuleHandleW(L"user32.dll");
                      if (user32)
                      {
                          auto pGetDpiForWindow = reinterpret_cast<UINT (WINAPI *)(HWND)>(
                              ::GetProcAddress(user32, "GetDpiForWindow"));
                          if (pGetDpiForWindow)
                              return FLOAT(pGetDpiForWindow(hwnd));
                      }
                  }
                  HDC hdc = ::GetDC(NULL);
                  FLOAT dpi = hdc ? FLOAT(::GetDeviceCaps(hdc, LOGPIXELSX)) : DEFAULT_DESKTOP_DPI;
                  if (hdc) ::ReleaseDC(NULL, hdc);
                  return (dpi > 0.0f) ? dpi : DEFAULT_DESKTOP_DPI;
              }

          '''

          if "get_window_dpi" not in src:
              src = re.sub(
                  r'(constexpr FLOAT DEFAULT_DESKTOP_DPI\s*=\s*96\.0f\s*;)',
                  r'\1\n' + helper,
                  src, count=1)

          src = re.sub(
              r'prop\.dpiX\s*=\s*DEFAULT_DESKTOP_DPI\s*;',
              'const FLOAT dpi = get_window_dpi(pShared->hWindow);\n'
              '                    prop.dpiX                   = dpi;',
              src, count=1)
          src = re.sub(
              r'prop\.dpiY\s*=\s*DEFAULT_DESKTOP_DPI\s*;',
              'prop.dpiY                   = dpi;',
              src, count=1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(src)
          print("WinDDSurface.cpp OK")
          PY

          echo "Patching $DISPLAY"
          python3 - << 'PY' "$DISPLAY"
          import sys, re
          path = sys.argv[1]
          with open(path, "r", encoding="utf-8", errors="replace") as f:
              src = f.read()

          if "shellscalingapi.h" not in src:
              src = src.replace(
                  "#include <windows.h>",
                  "#include <windows.h>\n#include <shellscalingapi.h>")

          awareness = '''
                  // Set per-monitor DPI awareness (best effort)
                  {
                      HMODULE user32 = ::GetModuleHandleW(L"user32.dll");
                      if (user32)
                      {
                          auto pSetCtx = reinterpret_cast<BOOL (WINAPI *)(DPI_AWARENESS_CONTEXT)>(
                              ::GetProcAddress(user32, "SetProcessDpiAwarenessContext"));
                          if (pSetCtx)
                              pSetCtx(DPI_AWARENESS_CONTEXT_PER_MONITOR_AWARE_V2);
                          else
                          {
                              HMODULE shcore = ::LoadLibraryW(L"Shcore.dll");
                              if (shcore)
                              {
                                  auto pSet = reinterpret_cast<HRESULT (WINAPI *)(PROCESS_DPI_AWARENESS)>(
                                      ::GetProcAddress(shcore, "SetProcessDpiAwareness"));
                                  if (pSet)
                                      pSet(PROCESS_PER_MONITOR_DPI_AWARE);
                                  ::FreeLibrary(shcore);
                              }
                          }
                      }
                  }

          '''

          if "SetProcessDpiAwarenessContext" not in src and "SetProcessDpiAwareness" not in src:
              src = re.sub(
                  r'(status_t WinDisplay::init\(int argc, const char \*\*argv\)\s*\{\s*)',
                  r'\1' + awareness,
                  src, count=1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(src)
          print("WinDisplay.cpp OK")
          PY

          echo "=== Verification ==="
          grep -n "get_window_dpi\|prop.dpiX\|SetProcessDpiAwareness" "$SURFACE" "$DISPLAY" || true

      - name: Build
        run: |
          cd lsp
          make VERBOSE=1

      - name: Package (official targets)
        run: |
          ARTIFACT_DIR="${GITHUB_WORKSPACE}/artifacts/windows-x64"
          mkdir -p "$ARTIFACT_DIR"

          cd lsp

          # Use the project's own packaging targets
          make package || make bundle || true
          make install DESTDIR="${ARTIFACT_DIR}/install" || true

          # Collect everything useful
          find .build -type f \( -name "*.dll" -o -name "*.exe" \) -exec cp -v {} "$ARTIFACT_DIR/" \;
          find "${ARTIFACT_DIR}/install" -type f \( -name "*.dll" -o -name "*.exe" \) -exec cp -v {} "$ARTIFACT_DIR/" \; 2>/dev/null || true

          # Also keep any .vst3 / .clap directories if they appeared
          find .build "${ARTIFACT_DIR}/install" -type d \( -name "*.vst3" -o -name "*.clap" \) 2>/dev/null | while read d; do
            cp -a "$d" "$ARTIFACT_DIR/"
          done

          echo "=== Final artifact contents ==="
          ls -la "$ARTIFACT_DIR"
          find "$ARTIFACT_DIR" | head -50

      - uses: actions/upload-artifact@v4
        with:
          name: lsp-plugins-windows-x64
          path: artifacts/windows-x64
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # macOS arm64 (Apple Silicon)
  # --------------------------------------------------------------------------
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install make pkg-config cairo freetype libsndfile libpng

      - name: Fetch
        run: |
          git clone --depth 1 https://github.com/lsp-plugins/lsp-plugins.git lsp
          cd lsp
          gmake config FEATURES="${{ env.FEATURES }}"
          gmake fetch

      - name: Build
        run: |
          cd lsp
          gmake VERBOSE=1

      - name: Package (official targets)
        run: |
          ARTIFACT_DIR="${GITHUB_WORKSPACE}/artifacts/macos-arm64"
          mkdir -p "$ARTIFACT_DIR"

          cd lsp

          # Official packaging
          gmake package || gmake bundle || true
          gmake install DESTDIR="${ARTIFACT_DIR}/install" || true

          # Collect bundles (preferred)
          find .build "${ARTIFACT_DIR}/install" -type d \( -name "*.vst3" -o -name "*.clap" -o -name "*.component" \) 2>/dev/null | while read d; do
            echo "Copying bundle: $d"
            cp -a "$d" "$ARTIFACT_DIR/"
          done

          # Fallback: the raw dylibs
          find .build -type f \( -name "*vst3*.dylib" -o -name "*clap*.dylib" -o -name "*vst2*.dylib" \) \
            -exec cp -v {} "$ARTIFACT_DIR/" \; 2>/dev/null || true

          echo "=== Final artifact contents ==="
          ls -la "$ARTIFACT_DIR"
          find "$ARTIFACT_DIR" | head -50

      - uses: actions/upload-artifact@v4
        with:
          name: lsp-plugins-macos-arm64
          path: artifacts/macos-arm64
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # macOS x86_64 (Intel)
  # --------------------------------------------------------------------------
  macos-x64:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install make pkg-config cairo freetype libsndfile libpng

      - name: Show environment
        run: |
          uname -a
          arch
          clang --version || true

      - name: Fetch
        run: |
          git clone --depth 1 https://github.com/lsp-plugins/lsp-plugins.git lsp
          cd lsp
          gmake config \
            FEATURES="${{ env.FEATURES }}" \
            ARCHITECTURE=x86_64 \
            CFLAGS="-mno-avx2 -mno-avx512f -mno-avx512cd -mno-avx512vl -mno-avx512bw -mno-avx512dq" \
            CXXFLAGS="-mno-avx2 -mno-avx512f -mno-avx512cd -mno-avx512vl -mno-avx512bw -mno-avx512dq"
          gmake fetch

      - name: Build
        run: |
          cd lsp
          export CFLAGS="-mno-avx2 -mno-avx512f -mno-avx512cd -mno-avx512vl -mno-avx512bw -mno-avx512dq"
          export CXXFLAGS="$CFLAGS"
          gmake VERBOSE=1

      - name: Package (official targets)
        run: |
          ARTIFACT_DIR="${GITHUB_WORKSPACE}/artifacts/macos-x64"
          mkdir -p "$ARTIFACT_DIR"

          cd lsp

          gmake package || gmake bundle || true
          gmake install DESTDIR="${ARTIFACT_DIR}/install" || true

          find .build "${ARTIFACT_DIR}/install" -type d \( -name "*.vst3" -o -name "*.clap" -o -name "*.component" \) 2>/dev/null | while read d; do
            echo "Copying bundle: $d"
            cp -a "$d" "$ARTIFACT_DIR/"
          done

          find .build -type f \( -name "*vst3*.dylib" -o -name "*clap*.dylib" -o -name "*vst2*.dylib" \) \
            -exec cp -v {} "$ARTIFACT_DIR/" \; 2>/dev/null || true

          echo "=== Final artifact contents ==="
          ls -la "$ARTIFACT_DIR"
          find "$ARTIFACT_DIR" | head -50

      - uses: actions/upload-artifact@v4
        with:
          name: lsp-plugins-macos-x64
          path: artifacts/macos-x64
          if-no-files-found: error
