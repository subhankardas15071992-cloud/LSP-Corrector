name: LSP Plugins (Windows + macOS) with safer HiDPI fix

on:
  push:
    branches: [master, main, devel]
  pull_request:
    branches: [master, main, devel]
  workflow_dispatch:

env:
  FEATURES: "ui vst2 vst3 clap"
  MAKEFLAGS: "-j4"

jobs:
  # --------------------------------------------------------------------------
  # Windows x86_64
  # --------------------------------------------------------------------------
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 + toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python

      - name: Fetch official LSP sources
        run: |
          git clone --depth 1 https://github.com/lsp-plugins/lsp-plugins.git lsp
          cd lsp
          make config FEATURES="${{ env.FEATURES }}"
          make fetch

      - name: Apply safer HiDPI fix (Windows)
        run: |
          cd lsp
          SURFACE=$(find modules -path "*/lsp-ws-lib/src/main/win/WinDDSurface.cpp" | head -1)
          DISPLAY=$(find modules -path "*/lsp-ws-lib/src/main/win/WinDisplay.cpp" | head -1)

          if [ -z "$SURFACE" ] || [ -z "$DISPLAY" ]; then
            echo "ERROR: source files not found"
            exit 1
          fi

          echo "Patching $SURFACE"
          python3 - << 'PY' "$SURFACE"
          import sys, re
          path = sys.argv[1]
          with open(path, "r", encoding="utf-8", errors="replace") as f:
              src = f.read()

          new_block = '''
                    FLOAT dpi = DEFAULT_DESKTOP_DPI;
                    if (pShared && pShared->hWindow)
                    {
                        HMODULE user32 = ::GetModuleHandleW(L"user32.dll");
                        if (user32)
                        {
                            auto pGetDpiForWindow = reinterpret_cast<UINT (WINAPI *)(HWND)>(
                                ::GetProcAddress(user32, "GetDpiForWindow"));
                            if (pGetDpiForWindow)
                            {
                                UINT d = pGetDpiForWindow(pShared->hWindow);
                                if (d > 0)
                                    dpi = FLOAT(d);
                            }
                        }
                    }
                    prop.dpiX                   = dpi;
                    prop.dpiY                   = dpi;
          '''

          src = re.sub(
              r'prop\.dpiX\s*=\s*DEFAULT_DESKTOP_DPI\s*;\s*\n\s*prop\.dpiY\s*=\s*DEFAULT_DESKTOP_DPI\s*;',
              new_block.strip(),
              src,
              count=1
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(src)
          print("WinDDSurface.cpp patched (minimal DPI fix)")
          PY

          echo "Patching $DISPLAY (early DPI awareness, best-effort only)"
          python3 - << 'PY' "$DISPLAY"
          import sys, re
          path = sys.argv[1]
          with open(path, "r", encoding="utf-8", errors="replace") as f:
              src = f.read()

          awareness = '''
                  // Best-effort DPI awareness – never fail the init if this does not work
                  {
                      HMODULE user32 = ::GetModuleHandleW(L"user32.dll");
                      if (user32)
                      {
                          auto pSetCtx = reinterpret_cast<BOOL (WINAPI *)(void*)>(
                              ::GetProcAddress(user32, "SetProcessDpiAwarenessContext"));
                          if (pSetCtx)
                              pSetCtx((void*)(-4)); // DPI_AWARENESS_CONTEXT_PER_MONITOR_AWARE_V2
                      }
                  }
          '''

          if "SetProcessDpiAwarenessContext" not in src:
              src = re.sub(
                  r'(status_t WinDisplay::init\(int argc, const char \*\*argv\)\s*\{\s*)',
                  r'\1' + awareness,
                  src,
                  count=1
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(src)
          print("WinDisplay.cpp patched (safe awareness)")
          PY

          echo "=== Verification ==="
          grep -n "dpiX\|dpiY\|SetProcessDpiAwarenessContext\|GetDpiForWindow" "$SURFACE" "$DISPLAY" || true

      - name: Build
        run: |
          cd lsp
          make VERBOSE=1

      - name: Package
        run: |
          ARTIFACT_DIR="${GITHUB_WORKSPACE}/artifacts/windows-x64"
          mkdir -p "$ARTIFACT_DIR"

          cd lsp

          make install PREFIX=./INSTALL || true

          echo "=== Contents of INSTALL tree ==="
          find INSTALL -type f 2>/dev/null | head -80 || true

          if [ -d "INSTALL" ]; then
            [ -d "INSTALL/lib/vst"  ] && mkdir -p "$ARTIFACT_DIR/VST2"  && cp -a INSTALL/lib/vst/*  "$ARTIFACT_DIR/VST2/"  2>/dev/null || true
            [ -d "INSTALL/lib/vst3" ] && mkdir -p "$ARTIFACT_DIR/VST3"  && cp -a INSTALL/lib/vst3/* "$ARTIFACT_DIR/VST3/"  2>/dev/null || true
            [ -d "INSTALL/lib/clap" ] && mkdir -p "$ARTIFACT_DIR/CLAP"  && cp -a INSTALL/lib/clap/* "$ARTIFACT_DIR/CLAP/"  2>/dev/null || true

            find INSTALL -name "lsp-r3d-wgl*.dll" -exec cp -v {} "$ARTIFACT_DIR/" \; 2>/dev/null || true
            find INSTALL -name "*.dll" -exec cp -v {} "$ARTIFACT_DIR/" \; 2>/dev/null || true
          fi

          find .build -type f \( \
              -name "lsp-plugins-vst2.dll" -o \
              -name "lsp-plugins-vst3.dll" -o \
              -name "lsp-plugins-clap.dll" -o \
              -name "lsp-r3d-wgl*.dll" \
            \) -exec cp -v {} "$ARTIFACT_DIR/" \; 2>/dev/null || true

          # Ship MinGW runtime DLLs
          echo "=== Copying MinGW runtime DLLs ==="
          for dll in libwinpthread-1.dll libgcc_s_seh-1.dll libstdc++-6.dll libssp-0.dll; do
            for candidate in /ucrt64/bin/$dll /mingw64/bin/$dll /usr/bin/$dll; do
              if [ -f "$candidate" ]; then
                cp -v "$candidate" "$ARTIFACT_DIR/"
                [ -d "$ARTIFACT_DIR/VST2" ] && cp -v "$candidate" "$ARTIFACT_DIR/VST2/" || true
                [ -d "$ARTIFACT_DIR/VST3" ] && cp -v "$candidate" "$ARTIFACT_DIR/VST3/" || true
                [ -d "$ARTIFACT_DIR/CLAP" ] && cp -v "$candidate" "$ARTIFACT_DIR/CLAP/" || true
                break
              fi
            done
          done

          echo "=== Final artifact contents ==="
          find "$ARTIFACT_DIR" | sort

      - uses: actions/upload-artifact@v4
        with:
          name: lsp-plugins-windows-x64
          path: artifacts/windows-x64
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # macOS arm64 (Apple Silicon)
  # --------------------------------------------------------------------------
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install make pkg-config cairo freetype libsndfile libpng

      - name: Fetch
        run: |
          git clone --depth 1 https://github.com/lsp-plugins/lsp-plugins.git lsp
          cd lsp
          gmake config FEATURES="${{ env.FEATURES }}"
          gmake fetch

      - name: Apply safer HiDPI / scale fix (macOS)
        run: |
          cd lsp

          # The existing lltwist display_pixel_scale() logic is already present
          # in recent LSP. We only reinforce it with a small safety comment and
          # ensure the conversion from physical to logical scale stays intact.
          WRAPPER=$(find modules -path "*/lsp-plugin-fw/include/lsp-plug.in/plug-fw/wrap/vst3/impl/ui_wrapper.h" | head -1)

          if [ -n "$WRAPPER" ]; then
            echo "Found ui_wrapper.h – applying light safety reinforcement"
            # Only add a clarifying comment; do not change logic that already works
            sed -i.bak 's|// On macOS hosts report the factor in PHYSICAL pixels per point|// On macOS hosts report the factor in PHYSICAL pixels per point\n            // (reinforced: keep existing conversion to logical zoom factor)|' "$WRAPPER" || true
          else
            echo "ui_wrapper.h not found – skipping (scale logic already present in current LSP)"
          fi

      - name: Build
        run: |
          cd lsp
          gmake VERBOSE=1

      - name: Package
        run: |
          ARTIFACT_DIR="${GITHUB_WORKSPACE}/artifacts/macos-arm64"
          mkdir -p "$ARTIFACT_DIR"

          cd lsp
          gmake install PREFIX=./INSTALL || true

          echo "=== Contents of INSTALL tree ==="
          find INSTALL -type f 2>/dev/null | head -80 || true

          if [ -d "INSTALL" ]; then
            [ -d "INSTALL/lib/vst"  ] && mkdir -p "$ARTIFACT_DIR/VST2"  && cp -a INSTALL/lib/vst/*  "$ARTIFACT_DIR/VST2/"  2>/dev/null || true
            [ -d "INSTALL/lib/vst3" ] && mkdir -p "$ARTIFACT_DIR/VST3"  && cp -a INSTALL/lib/vst3/* "$ARTIFACT_DIR/VST3/"  2>/dev/null || true
            [ -d "INSTALL/lib/clap" ] && mkdir -p "$ARTIFACT_DIR/CLAP"  && cp -a INSTALL/lib/clap/* "$ARTIFACT_DIR/CLAP/"  2>/dev/null || true

            find INSTALL -name "*.dylib" -exec cp -v {} "$ARTIFACT_DIR/" \; 2>/dev/null || true
            find INSTALL -type d \( -name "*.vst3" -o -name "*.clap" -o -name "*.component" \) 2>/dev/null | while read d; do
              cp -a "$d" "$ARTIFACT_DIR/" || true
            done
          fi

          find .build -type d \( -name "*.vst3" -o -name "*.clap" -o -name "*.component" \) 2>/dev/null | while read d; do
            cp -a "$d" "$ARTIFACT_DIR/" || true
          done
          find .build -type f \( \
              -name "*vst3*.dylib" -o \
              -name "*clap*.dylib" -o \
              -name "*vst2*.dylib" -o \
              -name "lsp-plugins*.dylib" \
            \) -exec cp -v {} "$ARTIFACT_DIR/" \; 2>/dev/null || true

          echo "=== Final artifact contents ==="
          find "$ARTIFACT_DIR" | sort | head -60

      - uses: actions/upload-artifact@v4
        with:
          name: lsp-plugins-macos-arm64
          path: artifacts/macos-arm64
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # macOS x86_64 (Intel)
  # --------------------------------------------------------------------------
  macos-x64:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install make pkg-config cairo freetype libsndfile libpng

      - name: Show environment
        run: |
          uname -a
          arch
          clang --version || true

      - name: Fetch
        run: |
          git clone --depth 1 https://github.com/lsp-plugins/lsp-plugins.git lsp
          cd lsp
          gmake config \
            FEATURES="${{ env.FEATURES }}" \
            ARCHITECTURE=x86_64 \
            CFLAGS="-mno-avx2 -mno-avx512f -mno-avx512cd -mno-avx512vl -mno-avx512bw -mno-avx512dq" \
            CXXFLAGS="-mno-avx2 -mno-avx512f -mno-avx512cd -mno-avx512vl -mno-avx512bw -mno-avx512dq"
          gmake fetch

      - name: Apply safer HiDPI / scale fix (macOS)
        run: |
          cd lsp

          WRAPPER=$(find modules -path "*/lsp-plugin-fw/include/lsp-plug.in/plug-fw/wrap/vst3/impl/ui_wrapper.h" | head -1)

          if [ -n "$WRAPPER" ]; then
            echo "Found ui_wrapper.h – applying light safety reinforcement"
            sed -i.bak 's|// On macOS hosts report the factor in PHYSICAL pixels per point|// On macOS hosts report the factor in PHYSICAL pixels per point\n            // (reinforced: keep existing conversion to logical zoom factor)|' "$WRAPPER" || true
          else
            echo "ui_wrapper.h not found – skipping"
          fi

      - name: Build
        run: |
          cd lsp
          export CFLAGS="-mno-avx2 -mno-avx512f -mno-avx512cd -mno-avx512vl -mno-avx512bw -mno-avx512dq"
          export CXXFLAGS="$CFLAGS"
          gmake VERBOSE=1

      - name: Package
        run: |
          ARTIFACT_DIR="${GITHUB_WORKSPACE}/artifacts/macos-x64"
          mkdir -p "$ARTIFACT_DIR"

          cd lsp
          gmake install PREFIX=./INSTALL || true

          echo "=== Contents of INSTALL tree ==="
          find INSTALL -type f 2>/dev/null | head -80 || true

          if [ -d "INSTALL" ]; then
            [ -d "INSTALL/lib/vst"  ] && mkdir -p "$ARTIFACT_DIR/VST2"  && cp -a INSTALL/lib/vst/*  "$ARTIFACT_DIR/VST2/"  2>/dev/null || true
            [ -d "INSTALL/lib/vst3" ] && mkdir -p "$ARTIFACT_DIR/VST3"  && cp -a INSTALL/lib/vst3/* "$ARTIFACT_DIR/VST3/"  2>/dev/null || true
            [ -d "INSTALL/lib/clap" ] && mkdir -p "$ARTIFACT_DIR/CLAP"  && cp -a INSTALL/lib/clap/* "$ARTIFACT_DIR/CLAP/"  2>/dev/null || true

            find INSTALL -name "*.dylib" -exec cp -v {} "$ARTIFACT_DIR/" \; 2>/dev/null || true
            find INSTALL -type d \( -name "*.vst3" -o -name "*.clap" -o -name "*.component" \) 2>/dev/null | while read d; do
              cp -a "$d" "$ARTIFACT_DIR/" || true
            done
          fi

          find .build -type d \( -name "*.vst3" -o -name "*.clap" -o -name "*.component" \) 2>/dev/null | while read d; do
            cp -a "$d" "$ARTIFACT_DIR/" || true
          done
          find .build -type f \( \
              -name "*vst3*.dylib" -o \
              -name "*clap*.dylib" -o \
              -name "*vst2*.dylib" -o \
              -name "lsp-plugins*.dylib" \
            \) -exec cp -v {} "$ARTIFACT_DIR/" \; 2>/dev/null || true

          echo "=== Final artifact contents ==="
          find "$ARTIFACT_DIR" | sort | head -60

      - uses: actions/upload-artifact@v4
        with:
          name: lsp-plugins-macos-x64
          path: artifacts/macos-x64
          if-no-files-found: error
