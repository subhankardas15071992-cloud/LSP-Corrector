name: LSP Plugins (Windows + macOS) with HiDPI fix

on:
  push:
    branches: [master, main, devel]
  pull_request:
    branches: [master, main, devel]
  workflow_dispatch:

env:
  FEATURES: "ui vst2 vst3 clap"
  MAKEFLAGS: "-j4"

jobs:
  # --------------------------------------------------------------------------
  # Windows x86_64
  # --------------------------------------------------------------------------
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Install MSYS2 + toolchain + patch
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make patch
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python

      - name: Fetch official LSP sources
        run: |
          git clone --depth 1 https://github.com/lsp-plugins/lsp-plugins.git lsp
          cd lsp
          make config FEATURES="${{ env.FEATURES }}"
          make fetch

      - name: Apply HiDPI / DPI-awareness patch
        run: |
          cd lsp

          cat > /tmp/lsp-hidpi.patch << 'EOF'
          --- a/modules/lsp-ws-lib/src/main/win/WinDDSurface.cpp
          +++ b/modules/lsp-ws-lib/src/main/win/WinDDSurface.cpp
          @@ -43,6 +43,29 @@
                       constexpr FLOAT DEFAULT_DESKTOP_DPI     = 96.0f;
           
          +            static FLOAT get_window_dpi(HWND hwnd)
          +            {
          +                if (hwnd)
          +                {
          +                    HMODULE user32 = ::GetModuleHandleW(L"user32.dll");
          +                    if (user32)
          +                    {
          +                        auto pGetDpiForWindow = reinterpret_cast<UINT (WINAPI *)(HWND)>(
          +                            ::GetProcAddress(user32, "GetDpiForWindow"));
          +                        if (pGetDpiForWindow)
          +                            return FLOAT(pGetDpiForWindow(hwnd));
          +                    }
          +                }
          +                HDC hdc = ::GetDC(NULL);
          +                FLOAT dpi = hdc ? FLOAT(::GetDeviceCaps(hdc, LOGPIXELSX)) : DEFAULT_DESKTOP_DPI;
          +                if (hdc) ::ReleaseDC(NULL, hdc);
          +                return (dpi > 0.0f) ? dpi : DEFAULT_DESKTOP_DPI;
          +            }
          +
                       //----------------------------------------------------------------------
                       // Construction
                       //----------------------------------------------------------------------
          @@ -182,8 +205,10 @@
                               prop.type                   = D2D1_RENDER_TARGET_TYPE_DEFAULT;
                               prop.pixelFormat.format     = DXGI_FORMAT_B8G8R8A8_UNORM;
                               prop.pixelFormat.alphaMode  = D2D1_ALPHA_MODE_PREMULTIPLIED;
          -                    prop.dpiX                   = DEFAULT_DESKTOP_DPI;
          -                    prop.dpiY                   = DEFAULT_DESKTOP_DPI;
          +                    const FLOAT dpi             = get_window_dpi(pShared->hWindow);
          +                    prop.dpiX                   = dpi;
          +                    prop.dpiY                   = dpi;
                               prop.usage                  = D2D1_RENDER_TARGET_USAGE_GDI_COMPATIBLE;
                               prop.minLevel               = D2D1_FEATURE_LEVEL_DEFAULT;
           
          --- a/modules/lsp-ws-lib/src/main/win/WinDisplay.cpp
          +++ b/modules/lsp-ws-lib/src/main/win/WinDisplay.cpp
          @@ -40,6 +40,36 @@
           #include <lsp-plug.in/stdlib/string.h>
           #include <lsp-plug.in/common/debug.h>
           
          +#include <shellscalingapi.h>
          +
          +namespace lsp
          +{
          +    namespace ws
          +    {
          +        namespace win
          +        {
          +            static void set_process_dpi_awareness()
          +            {
          +                // Prefer Per-Monitor V2 (Windows 10 1703+)
          +                HMODULE user32 = ::GetModuleHandleW(L"user32.dll");
          +                if (user32)
          +                {
          +                    auto pSetCtx = reinterpret_cast<BOOL (WINAPI *)(DPI_AWARENESS_CONTEXT)>(
          +                        ::GetProcAddress(user32, "SetProcessDpiAwarenessContext"));
          +                    if (pSetCtx)
          +                    {
          +                        pSetCtx(DPI_AWARENESS_CONTEXT_PER_MONITOR_AWARE_V2);
          +                        return;
          +                    }
          +                }
          +
          +                // Fallback
          +                HMODULE shcore = ::LoadLibraryW(L"Shcore.dll");
          +                if (shcore)
          +                {
          +                    auto pSet = reinterpret_cast<HRESULT (WINAPI *)(PROCESS_DPI_AWARENESS)>(
          +                        ::GetProcAddress(shcore, "SetProcessDpiAwareness"));
          +                    if (pSet)
          +                        pSet(PROCESS_PER_MONITOR_DPI_AWARE);
          +                    ::FreeLibrary(shcore);
          +                }
          +            }
          +        }
          +    }
          +}
           
           //----------------------------------------------------------------------
           // WinDisplay implementation
          @@ -70,6 +100,8 @@
                       //----------------------------------------------------------------------
                       status_t WinDisplay::init(int version, const char *display)
                       {
          +                set_process_dpi_awareness();
          +
                           // Already initialized?
                           if (bInitialized)
                               return STATUS_OK;
          EOF

          echo "Applying patch..."
          if patch -p1 --dry-run < /tmp/lsp-hidpi.patch > /dev/null 2>&1; then
            patch -p1 < /tmp/lsp-hidpi.patch
            echo "Patch applied successfully"
          else
            echo "Direct patch failed, trying to locate files..."
            WS_LIB=$(find modules -type d -name "lsp-ws-lib" | head -1)
            if [ -n "$WS_LIB" ]; then
              echo "Found lsp-ws-lib at $WS_LIB"
              # Apply with correct strip level relative to modules/
              (cd modules && patch -p1 < /tmp/lsp-hidpi.patch) || {
                # Last resort: manual sed-style replacement for the critical lines
                echo "Falling back to sed replacements"
                find modules/lsp-ws-lib -name "WinDDSurface.cpp" -exec sed -i \
                  -e 's/prop\.dpiX\s*=\s*DEFAULT_DESKTOP_DPI;/const FLOAT dpi = get_window_dpi(pShared->hWindow); prop.dpiX = dpi;/' \
                  -e 's/prop\.dpiY\s*=\s*DEFAULT_DESKTOP_DPI;/prop.dpiY = dpi;/' {} \;
              }
            else
              echo "ERROR: could not find lsp-ws-lib"
              ls -la modules || true
              exit 1
            fi
          fi

      - name: Build
        run: |
          cd lsp
          make VERBOSE=1

      - name: Package artifacts
        run: |
          cd lsp
          mkdir -p ../artifacts/windows-x64
          find .build modules -type f \( -name "*.dll" -o -name "*.vst3" -o -name "*.clap" \) \
            2>/dev/null | while read f; do
              cp --parents "$f" ../artifacts/windows-x64/ 2>/dev/null || cp "$f" ../artifacts/windows-x64/
            done || true
          find . -maxdepth 4 -type d \( -name "bin" -o -name "lib" -o -name "vst3" \) 2>/dev/null | head -10

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lsp-plugins-windows-x64
          path: artifacts/windows-x64
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # macOS arm64 (Apple Silicon)
  # --------------------------------------------------------------------------
  macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install make pkg-config cairo freetype libsndfile libpng

      - name: Fetch official LSP sources
        run: |
          git clone --depth 1 https://github.com/lsp-plugins/lsp-plugins.git lsp
          cd lsp
          gmake config FEATURES="${{ env.FEATURES }}"
          gmake fetch

      - name: Apply macOS scale hardening (optional safety)
        run: |
          cd lsp
          # The official code already contains the lltwist display_pixel_scale() fix.
          # We only add a small comment + ensure the function is present.
          UI_WRAPPER=$(find modules -path "*/lsp-plugin-fw/include/lsp-plug.in/plug-fw/wrap/vst3/impl/ui_wrapper.h" | head -1)
          if [ -n "$UI_WRAPPER" ]; then
            echo "Found ui_wrapper.h at $UI_WRAPPER"
            # Nothing critical to change; the existing conversion is already correct.
            # Just touch the file so the build system notices it if needed.
            touch "$UI_WRAPPER"
          else
            echo "ui_wrapper.h not found (will rely on upstream fix)"
            find modules -name "ui_wrapper.h" || true
          fi

      - name: Build
        run: |
          cd lsp
          gmake VERBOSE=1

      - name: Package artifacts
        run: |
          cd lsp
          mkdir -p ../artifacts/macos-arm64
          find .build modules -type f \( -name "*.dylib" -o -name "*.vst3" -o -name "*.clap" -o -name "*.component" \) \
            2>/dev/null | while read f; do
              cp --parents "$f" ../artifacts/macos-arm64/ 2>/dev/null || cp "$f" ../artifacts/macos-arm64/
            done || true

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lsp-plugins-macos-arm64
          path: artifacts/macos-arm64
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # macOS x86_64 (Intel)
  # --------------------------------------------------------------------------
  macos-x64:
    runs-on: macos-15-intel
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install make pkg-config cairo freetype libsndfile libpng

      - name: Fetch official LSP sources
        run: |
          git clone --depth 1 https://github.com/lsp-plugins/lsp-plugins.git lsp
          cd lsp
          gmake config FEATURES="${{ env.FEATURES }}"
          gmake fetch

      - name: Apply macOS scale hardening (optional safety)
        run: |
          cd lsp
          UI_WRAPPER=$(find modules -path "*/lsp-plugin-fw/include/lsp-plug.in/plug-fw/wrap/vst3/impl/ui_wrapper.h" | head -1)
          if [ -n "$UI_WRAPPER" ]; then
            echo "Found ui_wrapper.h at $UI_WRAPPER"
            touch "$UI_WRAPPER"
          else
            echo "ui_wrapper.h not found (will rely on upstream fix)"
            find modules -name "ui_wrapper.h" || true
          fi

      - name: Build
        run: |
          cd lsp
          gmake VERBOSE=1

      - name: Package artifacts
        run: |
          cd lsp
          mkdir -p ../artifacts/macos-x64
          find .build modules -type f \( -name "*.dylib" -o -name "*.vst3" -o -name "*.clap" -o -name "*.component" \) \
            2>/dev/null | while read f; do
              cp --parents "$f" ../artifacts/macos-x64/ 2>/dev/null || cp "$f" ../artifacts/macos-x64/
            done || true

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lsp-plugins-macos-x64
          path: artifacts/macos-x64
          if-no-files-found: warn
